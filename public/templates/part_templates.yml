templates:
  - name: "2管編成 (古典派)"
    description: "フルート、オーボエ、クラリネット、ファゴットが各2本ずつの標準的な編成です。"
    parts:
      - "Flute"
      - "Oboe"
      - "Clarinet"
      - "Bassoon"
      - "Horn"
      - "Trumpet"
      - "Timpani"
      - "1st Violin"
      - "2nd Violin"
      - "Viola"
      - "Cello"
      - "Contrabass"

  - name: "3管編成 (ロマン派後期)"
    description: "ピッコロや特殊管楽器を含む、大規模な3管編成です。"
    parts:
      - "Piccolo"
      - "Flute"
      - "Oboe"
      - "English Horn"
      - "Clarinet in Eb"
      - "Clarinet in Bb & A"
      - "Bass Clarinet"
      - "Bassoon"
      - "Contrabassoon"
      - "Horn"
      - "Trumpet"
      - "Trombone"
      - "Bass Trombone"
      - "Tuba"
      - "Timpani"
      - "Percussion"
      - "Harp"
      - "Piano/Celesta"
      - "1st Violin"
      - "2nd Violin"
      - "Viola"
      - "Cello"
      - "Contrabass"

  - name: "弦楽合奏"
    description: "弦楽器のみで構成されるアンサンブルです。"
    parts:
      - "1st Violin"
      - "2nd Violin"
      - "Viola"
      - "Cello"
      - "Contrabass"

  - name: "吹奏楽 (小編成)"
    description: "一般的なスクールバンド向けの小編成です。"
    parts:
      - "Piccolo"
      - "Flute"
      - "Oboe"
      - "Bassoon"
      - "Clarinet in Eb"
      - "Clarinet in Bb"
      - "Alto Clarinet"
      - "Bass Clarinet"
      - "Alto Saxophone"
      - "Tenor Saxophone"
      - "Baritone Saxophone"
      - "Trumpet"
      - "Horn"
      - "Trombone"
      - "Euphonium"
      - "Tuba"
      - "Contrabass"
      - "Timpani"
      - "Percussion"
